name: Build Android APK # rebuild with Supabase repository secrets

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Restore the same debug signing key on every build.
      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: entegre-ultra-android-debug-signing-key-v1

      # The cache action saves this file after the job. Create it explicitly on the first run.
      - name: Create stable Android debug signing key when missing
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # Give every APK a higher versionCode so Android recognizes it as an update.
      - name: Set Android version code
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          path = pathlib.Path("android/app/build.gradle")
          source = path.read_text()
          updated, count = re.subn(
              r'(?m)^(\\s*versionCode\\s+)\\d+\\s*$',
              lambda match: match.group(1) + os.environ["BUILD_NUMBER"],
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("versionCode satırı bulunamadı; APK güvenli biçimde derlenmedi.")
          path.write_text(updated)
          PY

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: entegre-ultra-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
